<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu site Responsivo</title>

    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            background-color: #FFF9D8;
        }

        header{
            background-color: #253C6D;
            color: white;
            text-align: center;
            padding: 5vh 5%;
        }

        nav{
            background-color: #30497D;
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 10px;            
        }

        nav a{
            color: white;           
        }

        main{
            width: 90%;
            margin: 30px auto;
        }

        .destaque{
            background-color: #2C5745;
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
            color: white;
        }

        .cards{
            display: flex;
            gap: 20px;
        }

        .card{
            width: 33%;
            min-height: 25vh;

            background-color: #BD5579;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card {
            flex-direction: column;
        }

        footer{
            background-color: #413333;
            color: white;
            text-align: center;
            padding: 4vh 5%;
            font-size: 25px;
        }


        /* celular */
        @media (max-width: 600px){
            nav{
                flex-direction: column;
                text-align: center;
            }

            .cards{
                flex-direction: column;
            }

            .card{
                width: 100%;
            }
        }

        h1{
            font-size: 50px;
            font-family:cursive
        }

        img {
width: 100%;
max-width: 200px;
aspect-ratio: 16 / 9; 
object-fit: cover; 
}

    </style>
  </head>
  <body>
    <header>
      <h1>Animais com empregos</h1>
      <p>Qual seria a profissão de cada um</p>
    </header>

    <nav>
      <a href="https://prezi.com/p/a1fambd4qxqy/e-se-os-animais-tivessem-profissoes/">Fonte</a>
      <a href="https://www.youtube.com/watch?v=hKlUkrH5t4o">Video</a>
      <a href="https://www.catho.com.br/carreira-sucesso/que-animal-voce-e-conheca-a-personalidade-dos-animais/">Quiz</a>
    </nav>

    <main>
      <section class="destaque">
        <h2>Bem-vindo!</h2>

        <p>Aqui debatemos a ideia de que os animais poderiam ter profissões.</p>
      </section>

      <section class="cards">
        <div class="card">
          <h2>Onça Pintada</h2>
          <img src="https://substackcdn.com/image/fetch/$s_!AiN1!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F73fb92f9-1e72-4510-a96c-f3bfbd0e9ac6_2700x1800.jpeg" alt="Onça Pintada">
      
        </div>

        <div class="card">
          <h2>Tartaruga</h2>
          <img src=" https://substackcdn.com/image/fetch/$s_!GZGG!,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F2e86478a-283d-48ac-9263-52c1fae15223_2700x1800.jpeg">
    
        </div>

        <div class="card">
          <h2>Coelho</h2>
          <img src="https://tse4.mm.bing.net/th/id/OIP.qF6hEnfPc1-Ykpicqj9EIwHaE7?r=0&rs=1&pid=ImgDetMain&o=7&rm=3">
    
        </div>

      </section>
    </main>

    <footer>Meu site - 2026</footer>
  </body>
</html>
